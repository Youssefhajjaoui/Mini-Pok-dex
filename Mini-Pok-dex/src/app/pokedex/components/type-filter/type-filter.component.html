<select
  class="type-filter"
  aria-label="Filter by type"
  [disabled]="loading()"
  (change)="onSelect($event)"
>
  <option value="" [selected]="!selected()">{{ loading() ? 'Loading types…' : 'All types' }}</option>
  @for (type of types(); track type) {
    <option [value]="type" [selected]="type === selected()">{{ type }}</option>
  }
</select>
