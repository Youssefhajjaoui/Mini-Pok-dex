<div class="type-filter" role="group" aria-label="Filter by type">
  <button
    type="button"
    class="type-filter__chip"
    [class.type-filter__chip--active]="!selected()"
    [attr.aria-pressed]="!selected()"
    (click)="selectedChange.emit(null)"
  >
    All types
  </button>
  @if (loading()) {
    @for (chip of skeletons; track chip) {
      <span class="type-filter__chip type-filter__chip--skeleton" aria-hidden="true"></span>
    }
  } @else {
    @for (chip of chips(); track chip.name) {
      <button
        type="button"
        class="type-filter__chip"
        [class.type-filter__chip--active]="chip.name === selected()"
        [attr.aria-pressed]="chip.name === selected()"
        [style.--type-bg]="chip.color.background"
        [style.--type-text]="chip.color.text"
        (click)="selectedChange.emit(chip.name)"
      >
        <span class="type-filter__dot" aria-hidden="true"></span>
        {{ chip.name }}
      </button>
    }
  }
</div>
